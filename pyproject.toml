[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-intelligence"
version = "0.1.0"
description = "AI-based visual assessment of construction material condition and usability"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Material Intelligence Team" }]
dependencies = [
  "nicegui>=2.5.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "ultralytics>=8.2.0",
  "opencv-python-headless>=4.9.0",
  "albumentations>=1.4.0",
  "captum>=0.7.0",
  "scikit-learn>=1.4.0",
  "plotly>=5.22.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "Pillow>=10.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "reportlab>=4.2.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
material-intelligence = "material_intelligence.app.main:run"
material-intelligence-seed-demo = "material_intelligence.app.services.demo_seed:main"
material-intelligence-train-starter = "material_intelligence.app.services.train_starter_models:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["material_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["material_intelligence/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
